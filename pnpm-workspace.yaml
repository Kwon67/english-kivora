# Preserve the existing security overrides during the lockfile migration.
overrides:
  # Serve the same local WASM as the Rive runtime behind the React adapter.
  '@rive-app/react-canvas@4.39.0>@rive-app/canvas': 2.51.0
  # These two consumers use the named matcher API, which minimatch 11 still exposes.
  '@ts-morph/common@0.27.0>minimatch': 11.0.9
  '@typescript-eslint/typescript-estree@8.60.0>minimatch': 11.0.9
  postcss: ^8.5.26
  tar: ^7.5.22
# Only reviewed native-tool installers may run; core-js only prints funding notices.
allowBuilds:
  core-js: false
  fsevents: true
  unrs-resolver: true
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  supabase: true
# Version-scoped exceptions for the verified stable releases tested in this migration.
minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.10.8'
  - '@posthog/core@1.67.1'
  - '@posthog/types@1.423.0'
  - lucide-react@1.71.0
  - posthog-js@1.447.10
  - resend@6.38.0
  - sql.js@1.16.0
