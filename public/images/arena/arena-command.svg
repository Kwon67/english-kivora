<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Arena strategy board</title>
  <desc id="desc">A clean competitive study board with player markers, progress paths, and ranking accents.</desc>
  <defs>
